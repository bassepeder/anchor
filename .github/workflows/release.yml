name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANCHOR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANCHOR_KEYSTORE_BASE64 is not set. Releases must be signed with the release keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-release.keystore"
          echo "ANCHOR_KEYSTORE_FILE=$RUNNER_TEMP/anchor-release.keystore" >> "$GITHUB_ENV"
          echo "ANCHOR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          ANCHOR_KEYSTORE_PASSWORD: ${{ secrets.ANCHOR_KEYSTORE_PASSWORD }}
          ANCHOR_KEY_ALIAS: ${{ secrets.ANCHOR_KEY_ALIAS }}
          ANCHOR_KEY_PASSWORD: ${{ secrets.ANCHOR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Check signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The release APK is signed with a debug key."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="anchor-$ANCHOR_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Anchor $ANCHOR_VERSION" --generate-notes

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/anchor-release.keystore"
